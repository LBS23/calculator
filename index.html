<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
    <div id="calculator-body">
            <div id="calculator-display">
            </div>
            <div class="first-row">
                <button id="all-clear">AC</button>
                <button id="last-number">⌫</button>
            </div>
            <div id="calculator-buttons">
                <div id="number-grid">
                    <div class="second-row">
                        <button class="number" id="seven">7</button>
                        <button class="number" id="eight">8</button>
                        <button class="number" id="nine">9</button>
                    </div>
                    <div class="third-row">
                        <button class="number" id="four">4</button>
                        <button class="number" id="five">5</button>
                        <button class="number" id="six">6</button>
                    </div>
                    <div class="fourth-row">
                        <button class="number" id="one">1</button>
                        <button class="number" id="two">2</button>
                        <button class="number" id="three">3</button>
                    </div>
                    <div class="fifth-row">
                        <button class="dot" id="point">.</button>
                        <button class="number" id="zero">0</button>
                        <button id="equals">=</button>
                    </div>
                </div>
            <div class="second-col">
                <div id="operators-grid">
                    <button class="operator" id="divided">÷</button>
                    <button class="operator" id="times">*</button>
                    <button class="operator" id="minus">-</button>
                    <button class="operator" id="plus">+</button>
                </div>
            </div>
            </div>
    </div>
</div>
    <script src="assets/js/main.js"></script>
</body>
</html>
